<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditya Sanskar Portal</title>
  <style>
    /* Login Page Styles */
    #authContainer { max-width: 400px; margin: 50px auto; background: #1a1a1a; padding: 25px; border-radius: 15px; color: white; }
    .auth-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
    .auth-btn { width: 100%; padding: 12px; background: #28a745; border: none; color: white; border-radius: 8px; cursor: pointer; }
    
    /* Original Code Styles */
    body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
    .nav-container { position: fixed; top: 10px; left: 10px; z-index: 100; }
    #listView, #chatView { display: none; margin-top: 60px; max-width: 400px; margin: 60px auto; }
    form { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: 60px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #28a745; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea, select { width: 100%; padding: 12px; margin: 5px 0 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 5px; width: 100%; }
    #chatMessages { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 10px; background: white; margin-bottom: 10px; }
  </style>
</head>
<body>

<div id="authContainer">
  <h2 id="authTitle">Sign In</h2>
  <input type="text" id="username" class="auth-input" placeholder="Username">
  <input type="password" id="password" class="auth-input" placeholder="Password">
  <button class="auth-btn" onclick="handleAuth()" id="authBtn">Sign In</button>
  <p id="toggleText" style="text-align:center; cursor:pointer; color:#007bff;" onclick="toggleMode()">Don't have an account? Sign Up</p>
</div>

<div id="mainPortal" style="display:none;">
  <div class="nav-container">
    <button onclick="goBack()" style="width: auto;">Back</button>
    <button onclick="showRequests()" style="width: auto;">My Requests</button>
    <button onclick="logout()" style="width: auto; background:#dc3545;">Logout</button>
  </div>

  <form id="appForm">
    <h2>App creator portal</h2>
    <label>App Name:</label> <input type="text" id="userName" required>
    <label>Company Name:</label> <input type="text" id="compName" required>
    <label>Core Concept:</label> <textarea id="concept" rows="3" required></textarea>
    <label>UI Style:</label>
    <select id="uiStyle">
      <option value="minimalist">Minimalist</option>
      <option value="bold">Bold & Vibrant</option>
    </select>
    <label>Theme Color:</label> <input type="color" id="themeColor">
    <label>Logo URL (Optional):</label> <input type="url" id="logoURL">
    <button type="button" style="background:#28a745; padding:14px;" onclick="submitRequest()">Submit Request</button>
  </form>

  <div id="listView"></div>
  <div id="chatView">
    <h3 id="chatTitle">Chat</h3>
    <div id="chatMessages"></div>
    <input type="text" id="msgInput" placeholder="Type a message...">
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, get, set } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";
  
  const db = getDatabase(initializeApp({ databaseURL: "https://slace-4d2ae-default-rtdb.asia-southeast1.firebasedatabase.app/" }));
  
  // Login Logic
  let isLogin = true;
  window.toggleMode = () => {
    isLogin = !isLogin;
    document.getElementById('authTitle').innerText = isLogin ? "Sign In" : "Sign Up";
    document.getElementById('authBtn').innerText = isLogin ? "Sign In" : "Sign Up";
    document.getElementById('toggleText').innerText = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Sign In";
  };

  window.handleAuth = async () => {
    const user = document.getElementById('username').value;
    const pass = document.getElementById('password').value;
    const userRef = ref(db, 'accounts/' + user);
    if (!isLogin) {
      const snap = await get(userRef);
      if (snap.exists()) alert("Username exists!"); else { await set(userRef, { password: pass }); alert("Created!"); }
    } else {
      const snap = await get(userRef);
      if (snap.exists() && snap.val().password === pass) {
        localStorage.setItem("myAppUser", user);
        location.reload();
      } else alert("Invalid Login!");
    }
  };

  if(localStorage.getItem("myAppUser")) {
    document.getElementById('authContainer').style.display = 'none';
    document.getElementById('mainPortal').style.display = 'block';
  }

  window.logout = () => { localStorage.removeItem("myAppUser"); location.reload(); };

  // Aapka Original Logic (thoda modification: users/username/inquiries)
  let currentUser = localStorage.getItem("myAppUser");
  window.submitRequest = () => {
    push(ref(db, 'users/' + currentUser + '/inquiries/'), {
      userName: document.getElementById("userName").value,
      company: document.getElementById("compName").value,
      concept: document.getElementById("concept").value,
      status: "Pending"
    }).then(() => alert("Request Submitted!"));
  };

  window.showRequests = () => {
    document.getElementById('appForm').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    onValue(ref(db, 'users/' + currentUser + '/inquiries/'), (snapshot) => {
      let list = document.getElementById('listView');
      list.innerHTML = "<h3>My Requests</h3>";
      snapshot.forEach((child) => {
        let d = child.val();
        let key = child.key;
        let card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<p><b>User:</b> ${d.userName}<br><b>Company:</b> ${d.company}<br><b>Status:</b> ${d.status}</p>`;
        let chatBtn = document.createElement('button');
        chatBtn.innerText = "Open Chat";
        chatBtn.onclick = () => openChat(key, d.company);
        card.appendChild(chatBtn);
        list.appendChild(card);
      });
    });
  };

  window.goBack = () => { location.reload(); };
  window.openChat = (id, comp) => { /* ... Chat Logic ... */ };
  window.sendMsg = () => { /* ... Send Msg Logic ... */ };
</script>
</body>
  </html>
